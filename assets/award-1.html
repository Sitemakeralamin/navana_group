
<style>
    /* Reset some styles */
    body, html {
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f8f9fa;
        color: #333;
    }

    main {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .error-container {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        width: 100%;
    }

    .error-header img.logo {
        max-height: 60px;
        margin-bottom: 20px;
    }

    .error-content {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 40px;
        text-align: left;
    }

    .error-text {
        max-width: 500px;
    }

    .error-text h1 {
        font-size: 48px;
        font-weight: bold;
        margin-bottom: 20px;
        color: #1b1464;
    }

    .error-text p {
        font-size: 18px;
        line-height: 1.6;
        margin-bottom: 30px;
    }

    .error-text a.btn {
        padding: 12px 25px;
        border-radius: 6px;
        font-weight: 500;
        transition: 0.3s;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 5px;
    }

    .error-text a.btn.btn-primary {
         background-color: #1b1464;
        color: #fff;
    }

    .error-text a.btn.btn-primary:hover {
        background-color: #d04a1e;
    }

    .error-text a.btn.btn-dark {
        background-color: #343a40;
        color: #fff;
    }

    .error-text a.btn.btn-dark:hover {
        background-color: #23272b;
    }

    .error-image img {
        max-width: 100%;
        height: auto;
        border-radius: 10px;
    }

    /* Responsive */
    @media(max-width: 992px) {
        .error-content {
            flex-direction: column;
            text-align: center;
        }
        .error-text h1 {
            font-size: 36px;
        }
        .error-text p {
            font-size: 16px;
        }
    }

    @media(max-width: 576px){
        .error-text a.btn {
            width: 100%;
            justify-content: center;
        }
    }

</style>

<body>
    <main>
        <div class="error-container">


            <div class="error-content">
                <!-- Text -->
                <div class="error-text">
                    <a href="/">
                        <img src="https://www.goldsandsgroup.com/assets/logo.png" alt="Logo" class="logo" />
                    </a>

                    <h1>404 Not Found!</h1>
                    <p>
                        We can’t find the page you’re looking for.
                        <br />
                        Check out our help center or head back to home.
                    </p>
                    <a href="#" class="btn btn-dark">
                        Help Center
                        <i class="feather-icon icon-arrow-right"></i>
                    </a>
                    <a href="/" class="btn btn-primary ms-2">Back to Home</a>
                </div>

                <!-- Image -->
                <div class="error-image">
                    <img src="/admin/images/404.jpg" alt="404 Error" />
                </div>
            </div>
        </div>
    </main>
